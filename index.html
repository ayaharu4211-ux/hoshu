<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2933">
<title>補修写真台帳</title>
<style>
  :root{
    --ink:#14181c; --sub:#5d6872; --line:#c9cfd6; --bg:#e9edf0;
    --card:#fff; --accent:#1f5f8b; --before:#6b7480; --after:#1c7a4d; --danger:#a3342b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,system-ui,sans-serif;
    font-size:16px;line-height:1.5;
  }
  button{font:inherit;color:inherit;cursor:pointer}
  input,textarea,select{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .bar{
    position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;
    padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));
    display:flex;align-items:center;gap:10px;
  }
  .bar h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.04em;flex:1}
  .bar .count{font-size:12px;opacity:.75;font-weight:400;display:block;letter-spacing:0}
  .bar button{background:#fff;color:var(--ink);border:none;border-radius:6px;padding:9px 14px;font-weight:600;font-size:14px}
  .wrap{max-width:720px;margin:0 auto;padding:14px 12px 80px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field+.field{margin-top:10px}
  .field label{font-size:12px;color:var(--sub);font-weight:600}
  .field input{width:100%;border:1px solid var(--line);border-radius:7px;padding:10px;background:#fff}
  .row2{display:flex;gap:10px}
  .row2 .field{margin-top:0}
  .row2 .field:first-child{flex:0 0 34%}
  .row2 .field:last-child{flex:1}

  .entry{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
  .entry-head{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);background:#f4f6f8}
  .num{font-weight:700;font-size:15px;flex:1}
  .icon-btn{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:13px;color:var(--sub);line-height:1.2}
  .icon-btn.del{color:var(--danger);border-color:#e2c4c1}
  .entry-body{padding:12px;display:flex;flex-direction:column;gap:12px}

  .photos{display:flex;gap:10px}
  .slot{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
  .slot-label{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
  .slot-label::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--before)}
  .slot.after .slot-label::before{background:var(--after)}
  .drop{position:relative;width:100%;aspect-ratio:4/3;border:1.5px dashed var(--line);border-radius:8px;background:#f7f9fa;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .drop img{width:100%;height:100%;object-fit:cover;display:block}
  .drop span{font-size:13px;color:var(--sub);text-align:center;padding:0 6px}
  .drop input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%}
  .clear-photo{position:absolute;top:5px;right:5px;z-index:2;background:rgba(20,24,28,.72);color:#fff;border:none;border-radius:5px;padding:4px 8px;font-size:12px}
  .rot-photo{position:absolute;top:5px;left:5px;z-index:2;background:rgba(20,24,28,.72);color:#fff;border:none;border-radius:5px;padding:4px 8px;font-size:12px}

  .add{width:100%;padding:15px;border:1.5px dashed var(--accent);background:#fff;color:var(--accent);border-radius:10px;font-weight:700;margin-bottom:14px}

  .pager{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0 16px}
  .pager button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 16px;font-size:14px}
  .pager button[disabled]{opacity:.4}
  .pager span{font-size:14px;color:var(--sub);min-width:96px;text-align:center}

  .range{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}
  .range .field{flex:1;min-width:84px;margin-top:0}
  .range button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:11px 18px;font-weight:700}
  .hint{font-size:12px;color:var(--sub);margin:8px 0 0;line-height:1.7}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .tools button,.tools label{flex:1;min-width:140px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:14px;color:var(--sub);cursor:pointer}
  .tools input{display:none}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
  .overlay{position:fixed;inset:0;background:rgba(233,237,240,.88);display:none;align-items:center;justify-content:center;z-index:60;font-weight:700}
  .overlay.show{display:flex}
  #print{display:none}

  @page{size:A4 portrait;margin:12mm}
  @media print{
    body{background:#fff}
    .bar,.wrap,.toast,.overlay{display:none !important}
    #print{display:block}
    .p-page{width:100%;height:271mm;display:flex;flex-direction:column;page-break-after:always;break-after:page}
    .p-page:last-child{page-break-after:auto;break-after:auto}
  }
  #print{font-size:10.5pt;color:#000}
  .p-head{display:flex;align-items:flex-end;gap:8mm;border-bottom:1.2pt solid #000;padding-bottom:2mm;margin-bottom:4mm}
  .p-title{font-size:14pt;font-weight:700;flex:1;letter-spacing:.04em}
  .p-meta{font-size:9.5pt;white-space:nowrap}
  .p-entry{border:.8pt solid #000;display:flex;flex-direction:column;overflow:hidden}
  .p-meta-row{display:flex;border-bottom:.8pt solid #000;height:12mm}
  .p-cell{display:flex;align-items:stretch}
  .p-key{background:#eceff1;padding:2mm 3mm;font-size:9.5pt;font-weight:700;display:flex;align-items:center;white-space:nowrap;border-right:.8pt solid #000}
  .p-val{padding:2mm 3mm;display:flex;align-items:center;font-size:11pt;word-break:break-word}
  .p-cell.floor{flex:0 0 42mm;border-right:.8pt solid #000}
  .p-cell.note{flex:1;min-width:0}
  .p-block{display:flex;flex-direction:column}
  .p-block.after{border-top:.8pt solid #000}
  .p-slot-label{font-size:10pt;font-weight:700;padding:1.5mm 3mm;height:8mm;border-bottom:.8pt solid #000;background:#eceff1;display:flex;align-items:center}
  .p-block.after .p-slot-label{background:#dff0e6}
  .p-img{height:112mm;display:flex;align-items:center;justify-content:center;padding:2mm;overflow:hidden}
  .p-img img{max-width:100%;max-height:108mm;object-fit:contain}
  .p-img .empty{font-size:9pt;color:#888}
</style>
</head>
<body>

<div class="bar">
  <h1>補修写真台帳<span class="count" id="countLabel">0件</span></h1>
  <button id="addTop">＋ 追加</button>
</div>

<div class="wrap">
  <div class="card">
    <div class="field">
      <label for="siteName">工事名・現場名</label>
      <input id="siteName" type="text" placeholder="例）○○ビル 新築工事">
    </div>
    <div class="field">
      <label for="docDate">日付</label>
      <input id="docDate" type="date">
    </div>
  </div>

  <div class="card">
    <div class="range">
      <div class="field">
        <label for="fromNo">PDFにする範囲</label>
        <input id="fromNo" type="number" min="1" value="1" inputmode="numeric">
      </div>
      <div class="field">
        <label for="toNo">〜</label>
        <input id="toNo" type="number" min="1" value="30" inputmode="numeric">
      </div>
      <button id="printBtn">PDFを作る</button>
    </div>
    <p class="hint">
      1件につき1ページです。1回の出力は30件までを目安に、それ以上は範囲をずらして分けてください。<br>
      保存領域の使用量: <span id="usage">—</span>
    </p>
    <div class="tools">
      <button id="exportBtn">データを書き出す</button>
      <label>データを読み込む<input type="file" id="importFile" accept="application/json"></label>
    </div>
  </div>

  <div id="list"></div>

  <div class="pager">
    <button id="prevPage">前の20件</button>
    <span id="pageLabel">1 / 1</span>
    <button id="nextPage">次の20件</button>
  </div>

  <button class="add" id="addBtn">＋ 補修箇所を追加</button>

  <p class="hint">
    入力と写真はこの端末に保存されます。機種変更や不具合に備えて、ときどき「データを書き出す」でバックアップを取ってください。
  </p>
</div>

<div id="print"></div>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay">読み込み中…</div>

<script>
(function(){
  "use strict";

  var DB_NAME = "hoshu-daicho", DB_VER = 1;
  var PAGE_SIZE = 20;
  var FULL_EDGE = 1200, FULL_Q = 0.74;   // 印刷用
  var THUMB_EDGE = 300, THUMB_Q = 0.6;   // 一覧用
  var PRINT_LIMIT = 60;

  var db = null;
  var memory = { meta:{site:"",date:""}, entries:[], photos:{}, thumbs:{} }; // DB不可時の代替
  var useMemory = false;

  var meta = { site:"", date:"" };
  var entries = [];   // {id, order, floor, note, hasBefore, hasAfter}
  var page = 0;

  /* ---------- IndexedDB ---------- */
  function openDB(){
    return new Promise(function(res){
      var req;
      try{ req = indexedDB.open(DB_NAME, DB_VER); }
      catch(e){ useMemory = true; return res(null); }
      req.onupgradeneeded = function(){
        var d = req.result;
        if(!d.objectStoreNames.contains("meta")) d.createObjectStore("meta");
        if(!d.objectStoreNames.contains("entries")) d.createObjectStore("entries", {keyPath:"id"});
        if(!d.objectStoreNames.contains("photos")) d.createObjectStore("photos");
        if(!d.objectStoreNames.contains("thumbs")) d.createObjectStore("thumbs");
      };
      req.onsuccess = function(){ res(req.result); };
      req.onerror = function(){ useMemory = true; res(null); };
      req.onblocked = function(){ useMemory = true; res(null); };
    });
  }
  function op(store, mode, fn){
    if(useMemory || !db) return Promise.resolve(memFallback(store, fn));
    return new Promise(function(res, rej){
      var t = db.transaction(store, mode);
      var r = fn(t.objectStore(store));
      t.oncomplete = function(){ res(r && r.result); };
      t.onerror = function(){ rej(t.error); };
      t.onabort  = function(){ rej(t.error); };
    });
  }
  function memFallback(){ return null; }

  function putMeta(){
    if(useMemory){ memory.meta = meta; return Promise.resolve(); }
    return op("meta","readwrite",function(s){ s.put(meta,"doc"); });
  }
  function getMeta(){
    if(useMemory) return Promise.resolve(memory.meta);
    return op("meta","readonly",function(s){ return s.get("doc"); });
  }
  function putEntry(e){
    if(useMemory){
      var i = memory.entries.findIndex(function(x){return x.id===e.id;});
      if(i<0) memory.entries.push(e); else memory.entries[i]=e;
      return Promise.resolve();
    }
    return op("entries","readwrite",function(s){ s.put(e); });
  }
  function delEntry(id){
    if(useMemory){
      memory.entries = memory.entries.filter(function(x){return x.id!==id;});
      delete memory.photos[id+":before"]; delete memory.photos[id+":after"];
      delete memory.thumbs[id+":before"]; delete memory.thumbs[id+":after"];
      return Promise.resolve();
    }
    return op("entries","readwrite",function(s){ s.delete(id); }).then(function(){
      return Promise.all(["before","after"].map(function(k){
        return Promise.all([
          op("photos","readwrite",function(s){ s.delete(id+":"+k); }),
          op("thumbs","readwrite",function(s){ s.delete(id+":"+k); })
        ]);
      }));
    });
  }
  function getEntries(){
    if(useMemory) return Promise.resolve(memory.entries.slice());
    return op("entries","readonly",function(s){ return s.getAll(); });
  }
  function putImg(store, key, data){
    if(useMemory){ memory[store][key]=data; return Promise.resolve(); }
    return op(store,"readwrite",function(s){ s.put(data, key); });
  }
  function getImg(store, key){
    if(useMemory) return Promise.resolve(memory[store][key]);
    return op(store,"readonly",function(s){ return s.get(key); });
  }
  function delImg(store, key){
    if(useMemory){ delete memory[store][key]; return Promise.resolve(); }
    return op(store,"readwrite",function(s){ s.delete(key); });
  }

  /* ---------- 小物 ---------- */
  function uid(){ return "e" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  var tTimer;
  function toast(m){
    var t=document.getElementById("toast");
    t.textContent=m; t.classList.add("show");
    clearTimeout(tTimer); tTimer=setTimeout(function(){t.classList.remove("show");},2800);
  }
  function busy(on, msg){
    var o=document.getElementById("overlay");
    if(msg) o.textContent=msg;
    o.classList.toggle("show", !!on);
  }
  function resize(file, edge, q){
    return new Promise(function(res, rej){
      var fr=new FileReader();
      fr.onload=function(){
        var img=new Image();
        img.onload=function(){
          var w=img.naturalWidth,h=img.naturalHeight;
          var sc=Math.min(1, edge/Math.max(w,h));
          var cv=document.createElement("canvas");
          cv.width=Math.round(w*sc); cv.height=Math.round(h*sc);
          cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
          res(cv.toDataURL("image/jpeg", q));
        };
        img.onerror=rej; img.src=fr.result;
      };
      fr.onerror=rej; fr.readAsDataURL(file);
    });
  }
  function rotate90(dataUrl){
    return new Promise(function(res, rej){
      if(!dataUrl) return res(dataUrl);
      var img=new Image();
      img.onload=function(){
        var cv=document.createElement("canvas");
        cv.width=img.height; cv.height=img.width;
        var ctx=cv.getContext("2d");
        ctx.translate(cv.width/2, cv.height/2);
        ctx.rotate(Math.PI/2);
        ctx.drawImage(img, -img.width/2, -img.height/2);
        res(cv.toDataURL("image/jpeg", 0.82));
      };
      img.onerror=rej;
      img.src=dataUrl;
    });
  }

  function showUsage(){
    var el=document.getElementById("usage");
    if(navigator.storage && navigator.storage.estimate){
      navigator.storage.estimate().then(function(e){
        var mb=(e.usage||0)/1048576;
        var q=(e.quota||0)/1048576;
        el.textContent = mb.toFixed(1)+" MB" + (q ? " / 上限 約"+Math.round(q)+" MB" : "");
      });
    } else el.textContent="—";
  }

  /* ---------- 一覧 ---------- */
  var list=document.getElementById("list");

  function sortEntries(){ entries.sort(function(a,b){ return a.order-b.order; }); }
  function pages(){ return Math.max(1, Math.ceil(entries.length/PAGE_SIZE)); }

  function render(){
    sortEntries();
    if(page > pages()-1) page = pages()-1;
    if(page < 0) page = 0;

    document.getElementById("countLabel").textContent = entries.length + "件";
    document.getElementById("pageLabel").textContent = (page+1)+" / "+pages();
    document.getElementById("prevPage").disabled = page===0;
    document.getElementById("nextPage").disabled = page>=pages()-1;

    list.innerHTML="";
    var start=page*PAGE_SIZE;
    var slice=entries.slice(start, start+PAGE_SIZE);

    slice.forEach(function(en, k){
      var no=start+k+1;
      var el=document.createElement("div");
      el.className="entry";
      el.innerHTML=
        '<div class="entry-head">'+
          '<span class="num">No.'+no+'</span>'+
          '<button class="icon-btn" data-act="up">上へ</button>'+
          '<button class="icon-btn" data-act="down">下へ</button>'+
          '<button class="icon-btn del" data-act="del">削除</button>'+
        '</div>'+
        '<div class="entry-body">'+
          '<div class="row2">'+
            '<div class="field"><label>階数</label>'+
              '<input type="text" data-f="floor" value="'+esc(en.floor)+'" placeholder="3F"></div>'+
            '<div class="field"><label>記入欄</label>'+
              '<input type="text" data-f="note" value="'+esc(en.note)+'" placeholder="自由に入力"></div>'+
          '</div>'+
          '<div class="photos">'+ slotHTML("before","補修前",en) + slotHTML("after","補修後",en) +'</div>'+
        '</div>';

      el.querySelectorAll("input[data-f]").forEach(function(inp){
        inp.addEventListener("input", function(){
          en[inp.getAttribute("data-f")]=inp.value;
          putEntry(en);
        });
      });

      el.querySelectorAll("button[data-act]").forEach(function(btn){
        btn.addEventListener("click", function(){
          var act=btn.getAttribute("data-act");
          var i=entries.indexOf(en);
          if(act==="del"){
            if(!confirm("No."+no+" を削除しますか？")) return;
            delEntry(en.id).then(function(){
              entries.splice(i,1); render(); showUsage();
            });
          } else if(act==="up" && i>0){
            swap(i,i-1);
          } else if(act==="down" && i<entries.length-1){
            swap(i,i+1);
          }
        });
      });

      el.querySelectorAll("input[type=file]").forEach(function(inp){
        inp.addEventListener("change", function(){
          var f=inp.files&&inp.files[0];
          inp.value="";
          if(!f) return;
          var slot=inp.getAttribute("data-slot");
          busy(true,"写真を処理中…");
          Promise.all([resize(f,FULL_EDGE,FULL_Q), resize(f,THUMB_EDGE,THUMB_Q)])
            .then(function(r){
              return Promise.all([
                putImg("photos", en.id+":"+slot, r[0]),
                putImg("thumbs", en.id+":"+slot, r[1])
              ]);
            })
            .then(function(){
              en["has"+slot.charAt(0).toUpperCase()+slot.slice(1)]=true;
              return putEntry(en);
            })
            .then(function(){ busy(false); render(); showUsage(); })
            .catch(function(){ busy(false); toast("保存できませんでした。空き容量を確認してください"); });
        });
      });

      el.querySelectorAll(".rot-photo").forEach(function(btn){
        btn.addEventListener("click", function(ev){
          ev.preventDefault(); ev.stopPropagation();
          var slot=btn.getAttribute("data-slot");
          var key=en.id+":"+slot;
          busy(true,"回転中…");
          Promise.all([getImg("photos",key), getImg("thumbs",key)])
            .then(function(r){
              return Promise.all([rotate90(r[0]), rotate90(r[1])]);
            })
            .then(function(r){
              return Promise.all([putImg("photos",key,r[0]), putImg("thumbs",key,r[1])]);
            })
            .then(function(){ busy(false); render(); })
            .catch(function(){ busy(false); toast("回転できませんでした"); });
        });
      });

      el.querySelectorAll(".clear-photo").forEach(function(btn){
        btn.addEventListener("click", function(ev){
          ev.preventDefault(); ev.stopPropagation();
          var slot=btn.getAttribute("data-slot");
          Promise.all([delImg("photos",en.id+":"+slot), delImg("thumbs",en.id+":"+slot)])
            .then(function(){
              en["has"+slot.charAt(0).toUpperCase()+slot.slice(1)]=false;
              return putEntry(en);
            })
            .then(function(){ render(); showUsage(); });
        });
      });

      list.appendChild(el);

      ["before","after"].forEach(function(slot){
        var flag = slot==="before" ? en.hasBefore : en.hasAfter;
        if(!flag) return;
        getImg("thumbs", en.id+":"+slot).then(function(data){
          if(!data) return;
          var box=el.querySelector('.drop[data-slot="'+slot+'"]');
          if(!box) return;
          var ph=box.querySelector("span");
          if(ph) ph.remove();
          var img=document.createElement("img");
          img.src=data; img.alt="";
          box.insertBefore(img, box.firstChild);
        });
      });
    });
  }

  function slotHTML(slot, label, en){
    var has = slot==="before" ? en.hasBefore : en.hasAfter;
    return '<div class="slot '+slot+'">'+
      '<span class="slot-label">'+label+'</span>'+
      '<div class="drop" data-slot="'+slot+'">'+
        (has ? '<button class="rot-photo" data-slot="'+slot+'">回転</button>'+
               '<button class="clear-photo" data-slot="'+slot+'">削除</button>'
             : '<span>タップして写真を選ぶ</span>')+
        '<input type="file" accept="image/*" data-slot="'+slot+'">'+
      '</div></div>';
  }

  function swap(i,j){
    var a=entries[i], b=entries[j];
    var t=a.order; a.order=b.order; b.order=t;
    Promise.all([putEntry(a), putEntry(b)]).then(render);
  }

  /* ---------- 印刷 ---------- */
  function buildPrint(from, to){
    sortEntries();
    var slice=entries.slice(from-1, to);
    var box=document.getElementById("print");
    box.innerHTML="";
    var dateText = meta.date ? meta.date.replace(/-/g,"/") : "";
    var total=slice.length;

    var jobs=[];
    for(var p=0;p<total;p++){
      var en=slice[p];
      var pg=document.createElement("div");
      pg.className="p-page";
      pg.innerHTML='<div class="p-head"><div class="p-title">'+
        (esc(meta.site)||"補修写真台帳")+'</div><div class="p-meta">'+
        (dateText?dateText+"　":"")+(p+1)+" / "+total+'</div></div>';
      var node=entryNode(en, from+p);
      pg.appendChild(node);
      jobs.push(fillPhotos(node, en));
      box.appendChild(pg);
    }
    return Promise.all(jobs);
  }

  function entryNode(en, no){
    var d=document.createElement("div");
    d.className="p-entry";
    d.innerHTML=
      '<div class="p-meta-row">'+
        '<div class="p-cell floor"><div class="p-key">No.'+no+'　階数</div>'+
          '<div class="p-val">'+esc(en.floor)+'</div></div>'+
        '<div class="p-cell note"><div class="p-key">記入欄</div>'+
          '<div class="p-val">'+esc(en.note)+'</div></div>'+
      '</div>'+
      '<div class="p-block before"><div class="p-slot-label">補修前</div>'+
        '<div class="p-img" data-slot="before"></div></div>'+
      '<div class="p-block after"><div class="p-slot-label">補修後</div>'+
        '<div class="p-img" data-slot="after"></div></div>';
    return d;
  }

  function fillPhotos(node, en){
    return Promise.all(["before","after"].map(function(slot){
      var cell=node.querySelector('.p-img[data-slot="'+slot+'"]');
      var has = slot==="before" ? en.hasBefore : en.hasAfter;
      if(!has){ cell.innerHTML='<span class="empty">写真なし</span>'; return Promise.resolve(); }
      return getImg("photos", en.id+":"+slot).then(function(data){
        if(!data){ cell.innerHTML='<span class="empty">写真なし</span>'; return; }
        return new Promise(function(res){
          var img=new Image();
          img.onload=res; img.onerror=res;
          img.src=data; img.alt="";
          cell.appendChild(img);
        });
      });
    }));
  }

  /* ---------- 操作 ---------- */
  var siteInput=document.getElementById("siteName");
  var dateInput=document.getElementById("docDate");

  siteInput.addEventListener("input", function(){ meta.site=siteInput.value; putMeta(); });
  dateInput.addEventListener("input", function(){ meta.date=dateInput.value; putMeta(); });

  function addEntry(){
    var maxOrder = entries.reduce(function(m,e){ return Math.max(m,e.order); }, 0);
    var en={ id:uid(), order:maxOrder+1, floor:"", note:"", hasBefore:false, hasAfter:false };
    entries.push(en);
    putEntry(en).then(function(){
      page = pages()-1;
      render();
      window.scrollTo({ top: document.body.scrollHeight, behavior:"smooth" });
    });
  }
  document.getElementById("addBtn").addEventListener("click", addEntry);
  document.getElementById("addTop").addEventListener("click", addEntry);

  document.getElementById("prevPage").addEventListener("click", function(){ page--; render(); window.scrollTo({top:0}); });
  document.getElementById("nextPage").addEventListener("click", function(){ page++; render(); window.scrollTo({top:0}); });

  /* ---------- PDFを直接作る ---------- */
  var DPI=150, MM=DPI/25.4;
  function mm(v){ return v*MM; }
  function pt(v){ return v/72*DPI; }

  function loadImg(src){
    return new Promise(function(res){
      if(!src) return res(null);
      var i=new Image();
      i.onload=function(){ res(i); };
      i.onerror=function(){ res(null); };
      i.src=src;
    });
  }

  function drawCell(ctx,x,y,w,h,fill){
    if(fill){ ctx.fillStyle=fill; ctx.fillRect(mm(x),mm(y),mm(w),mm(h)); }
    ctx.strokeStyle="#000"; ctx.lineWidth=Math.max(1,mm(0.25));
    ctx.strokeRect(mm(x),mm(y),mm(w),mm(h));
  }
  function drawText(ctx,text,x,y,size,bold,align){
    ctx.fillStyle="#000";
    ctx.font=(bold?"bold ":"")+Math.round(pt(size))+'px "Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif';
    ctx.textAlign=align||"left";
    ctx.textBaseline="middle";
    ctx.fillText(text, mm(x), mm(y));
  }
  function drawFit(ctx,img,x,y,w,h){
    if(!img) return;
    var bw=mm(w), bh=mm(h);
    var sc=Math.min(bw/img.width, bh/img.height);
    var dw=img.width*sc, dh=img.height*sc;
    ctx.drawImage(img, mm(x)+(bw-dw)/2, mm(y)+(bh-dh)/2, dw, dh);
  }

  function renderPage(en, no, pageNo, total){
    var cv=document.createElement("canvas");
    cv.width=Math.round(mm(210)); cv.height=Math.round(mm(297));
    var ctx=cv.getContext("2d");
    ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height);

    var dateText = meta.date ? meta.date.replace(/-/g,"/") : "";
    drawText(ctx, meta.site || "補修写真台帳", 12, 19, 14, true);
    drawText(ctx, (dateText?dateText+"　":"")+pageNo+" / "+total, 198, 19.5, 10, false, "right");
    ctx.strokeStyle="#000"; ctx.lineWidth=Math.max(1,mm(0.4));
    ctx.beginPath(); ctx.moveTo(mm(12),mm(23)); ctx.lineTo(mm(198),mm(23)); ctx.stroke();

    drawCell(ctx,12,27,34,12,"#eceff1");
    drawText(ctx,"No."+no+"　階数",14.5,33,10,true);
    drawCell(ctx,46,27,18,12);
    drawText(ctx,en.floor||"",55,33,11,false,"center");
    drawCell(ctx,64,27,20,12,"#eceff1");
    drawText(ctx,"記入欄",66.5,33,10,true);
    drawCell(ctx,84,27,114,12);
    drawText(ctx,en.note||"",86.5,33,11);

    drawCell(ctx,12,39,186,8,"#eceff1");
    drawText(ctx,"補修前",15,43.2,10,true);
    drawCell(ctx,12,47,186,114);
    drawCell(ctx,12,161,186,8,"#dff0e6");
    drawText(ctx,"補修後",15,165.2,10,true);
    drawCell(ctx,12,169,186,114);

    return Promise.all([
      en.hasBefore ? getImg("photos",en.id+":before").then(loadImg) : null,
      en.hasAfter  ? getImg("photos",en.id+":after").then(loadImg)  : null
    ]).then(function(imgs){
      if(imgs[0]) drawFit(ctx,imgs[0],14,49,182,110);
      else drawText(ctx,"写真なし",105,104,9,false,"center");
      if(imgs[1]) drawFit(ctx,imgs[1],14,171,182,110);
      else drawText(ctx,"写真なし",105,226,9,false,"center");
      var data=cv.toDataURL("image/jpeg",0.82);
      cv.width=cv.height=1;
      return { bytes:b64ToBytes(data.split(",")[1]), w:Math.round(mm(210)), h:Math.round(mm(297)) };
    });
  }

  function b64ToBytes(b64){
    var bin=atob(b64), len=bin.length, out=new Uint8Array(len);
    for(var i=0;i<len;i++) out[i]=bin.charCodeAt(i);
    return out;
  }

  function assemblePdf(pages){
    var enc=new TextEncoder();
    var chunks=[], len=0;
    function put(u8){ chunks.push(u8); len+=u8.length; }
    function putStr(s){ put(enc.encode(s)); }

    putStr("%PDF-1.4\n");
    put(new Uint8Array([0x25,0xE2,0xE3,0xCF,0xD3,0x0A]));

    var n=pages.length;
    var offsets={}, kids=[];
    for(var i=0;i<n;i++) kids.push((3+i*3)+" 0 R");

    function beginObj(id){ offsets[id]=len; putStr(id+" 0 obj\n"); }
    function endObj(){ putStr("\nendobj\n"); }

    beginObj(1); putStr("<< /Type /Catalog /Pages 2 0 R >>"); endObj();
    beginObj(2); putStr("<< /Type /Pages /Count "+n+" /Kids ["+kids.join(" ")+"] >>"); endObj();

    for(var p=0;p<n;p++){
      var pageId=3+p*3, contId=4+p*3, imgId=5+p*3;
      beginObj(pageId);
      putStr("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] "+
             "/Resources << /XObject << /Im0 "+imgId+" 0 R >> >> /Contents "+contId+" 0 R >>");
      endObj();

      var content="q 595.28 0 0 841.89 0 0 cm /Im0 Do Q";
      beginObj(contId);
      putStr("<< /Length "+content.length+" >>\nstream\n"+content+"\nendstream");
      endObj();

      var im=pages[p];
      beginObj(imgId);
      putStr("<< /Type /XObject /Subtype /Image /Width "+im.w+" /Height "+im.h+
             " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+im.bytes.length+" >>\nstream\n");
      put(im.bytes);
      putStr("\nendstream");
      endObj();
    }

    var total=2+n*3;
    var xrefStart=len;
    putStr("xref\n0 "+(total+1)+"\n0000000000 65535 f \n");
    for(var id=1;id<=total;id++){
      putStr(("0000000000"+offsets[id]).slice(-10)+" 00000 n \n");
    }
    putStr("trailer\n<< /Size "+(total+1)+" /Root 1 0 R >>\nstartxref\n"+xrefStart+"\n%%EOF\n");

    return new Blob(chunks,{type:"application/pdf"});
  }

  document.getElementById("printBtn").addEventListener("click", function(){
    if(!entries.length){ toast("先に補修箇所を追加してください"); return; }
    sortEntries();
    var from=parseInt(document.getElementById("fromNo").value,10)||1;
    var to=parseInt(document.getElementById("toNo").value,10)||entries.length;
    from=Math.max(1, Math.min(from, entries.length));
    to=Math.max(from, Math.min(to, entries.length));
    if(to-from+1 > PRINT_LIMIT){ toast("1回の出力は"+PRINT_LIMIT+"件までにしてください"); return; }

    var slice=entries.slice(from-1,to);
    var out=[];
    busy(true,"PDFを作成中… 1 / "+slice.length);

    var chain=Promise.resolve();
    slice.forEach(function(en,i){
      chain=chain.then(function(){
        busy(true,"PDFを作成中… "+(i+1)+" / "+slice.length);
        return renderPage(en, from+i, i+1, slice.length).then(function(pg){ out.push(pg); });
      });
    });

    chain.then(function(){
      var blob=assemblePdf(out);
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a");
      a.href=url;
      a.download=(meta.site||"補修写真台帳")+"_"+from+"-"+to+".pdf";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); },60000);
      busy(false);
      toast("PDFを作りました");
    }).catch(function(){
      busy(false);
      toast("作成に失敗しました。範囲を狭めて試してください");
    });
  });

  window.addEventListener("afterprint", function(){
    document.getElementById("print").innerHTML="";
  });

  document.getElementById("exportBtn").addEventListener("click", function(){
    busy(true,"書き出し中…");
    sortEntries();
    var out={ meta:meta, entries:entries, photos:{} };
    var jobs=[];
    entries.forEach(function(en){
      ["before","after"].forEach(function(slot){
        var has = slot==="before" ? en.hasBefore : en.hasAfter;
        if(!has) return;
        jobs.push(getImg("photos", en.id+":"+slot).then(function(d){
          if(d) out.photos[en.id+":"+slot]=d;
        }));
      });
    });
    Promise.all(jobs).then(function(){
      var blob=new Blob([JSON.stringify(out)],{type:"application/json"});
      var a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download=(meta.site||"補修写真台帳")+".json";
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); },2000);
      busy(false);
    }).catch(function(){ busy(false); toast("書き出しに失敗しました"); });
  });

  document.getElementById("importFile").addEventListener("change", function(ev){
    var f=ev.target.files&&ev.target.files[0];
    ev.target.value="";
    if(!f) return;
    if(!confirm("今のデータに読み込んだ内容を追加します。よろしいですか？")) return;
    busy(true,"読み込み中…");
    var r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result);
        if(!d||!Array.isArray(d.entries)) throw 0;
        var base=entries.reduce(function(m,e){ return Math.max(m,e.order); },0);
        var jobs=[];
        d.entries.forEach(function(en,i){
          var nid=uid();
          var ne={ id:nid, order:base+i+1, floor:en.floor||"", note:en.note||"",
                   hasBefore:false, hasAfter:false };
          ["before","after"].forEach(function(slot){
            var data = d.photos && d.photos[en.id+":"+slot];
            if(!data) return;
            ne["has"+slot.charAt(0).toUpperCase()+slot.slice(1)]=true;
            jobs.push(putImg("photos", nid+":"+slot, data));
            jobs.push(resizeDataUrl(data).then(function(th){ return putImg("thumbs", nid+":"+slot, th); }));
          });
          entries.push(ne);
          jobs.push(putEntry(ne));
        });
        if(d.meta && !meta.site && d.meta.site){
          meta.site=d.meta.site; siteInput.value=meta.site; jobs.push(putMeta());
        }
        Promise.all(jobs).then(function(){ busy(false); render(); showUsage(); toast("読み込みました"); });
      }catch(e){ busy(false); toast("このファイルは読み込めません"); }
    };
    r.readAsText(f);
  });

  function resizeDataUrl(dataUrl){
    return new Promise(function(res){
      var img=new Image();
      img.onload=function(){
        var sc=Math.min(1, THUMB_EDGE/Math.max(img.width,img.height));
        var cv=document.createElement("canvas");
        cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        res(cv.toDataURL("image/jpeg", THUMB_Q));
      };
      img.onerror=function(){ res(dataUrl); };
      img.src=dataUrl;
    });
  }

  /* ---------- 起動 ---------- */
  openDB().then(function(d){
    db=d;
    if(!db) useMemory=true;
    return getMeta();
  }).then(function(m){
    if(m) meta={ site:m.site||"", date:m.date||"" };
    if(!meta.date){
      var n=new Date();
      meta.date=n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");
    }
    siteInput.value=meta.site;
    dateInput.value=meta.date;
    return getEntries();
  }).then(function(list_){
    entries = (list_||[]).map(function(e){
      return { id:e.id, order:e.order||0, floor:e.floor||"", note:e.note||"",
               hasBefore:!!e.hasBefore, hasAfter:!!e.hasAfter };
    });
    if(!entries.length) entries.push({ id:uid(), order:1, floor:"", note:"", hasBefore:false, hasAfter:false });
    render();
    showUsage();
    if(useMemory) toast("この環境では保存が使えません。ファイルを保存して開き直してください");
  }).catch(function(){
    useMemory=true;
    render();
  });
})();
</script>
